# HelloAGENTS 本机连接配置
# 禁止提交到 Git：保存 IP、端口、用户名、SSH alias、密钥路径或凭据引用。
# 不要保存私钥正文、API token 或生产环境明文密码。

version: 1

hosts:
  local_windows:
    os: windows
    shell: powershell
    workspace: "{local_workspace}"
    ssh_client: "C:/Windows/System32/OpenSSH/ssh.exe"
    scp_client: "C:/Windows/System32/OpenSSH/scp.exe"
    path_style: windows
    encoding: utf-8

  dev_server:
    os: linux
    ip: "0.0.0.0"
    port: 22
    user: "deploy"
    ssh_alias: "{project_name}-dev"
    auth:
      method: ssh_key
      private_key_path: "C:/Users/{windows_user}/.ssh/{project_name}_dev_ed25519"

  test_server:
    os: linux
    ip: "0.0.0.0"
    port: 22
    user: "deploy"
    ssh_alias: "{project_name}-test"
    auth:
      method: ssh_key
      private_key_path: "C:/Users/{windows_user}/.ssh/{project_name}_test_ed25519"

  prod_server:
    os: linux
    ip: "0.0.0.0"
    port: 22
    user: "deploy"
    ssh_alias: "{project_name}-prod"
    protected: true
    auth:
      method: ssh_key
      private_key_path: "C:/Users/{windows_user}/.ssh/{project_name}_prod_ed25519"

credential_refs:
  # password_ref 示例:
  # local: "env:{PROJECT_NAME}_PASSWORD"
  # legacy_test_root: "wincred:{project_name}/legacy-test/root-password"
  # pypi_token: "env:PYPI_TOKEN"

profiles:
  local:
    password_ref: "env:{PROJECT_NAME}_PASSWORD"

warnings:
  - "secrets.local.yaml 禁止提交 Git"
  - "production 不允许使用 plaintext_password"
  - "优先使用 ssh_alias、ssh_key 或 password_ref"
