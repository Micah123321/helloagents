# HelloAGENTS Codex CLI Hooks 参考配置（仅供参考，非自动部署源）
#
# 此文件是 Codex CLI 配置的参考文档。实际配置由 config_helpers.py 中的
# _configure_codex_notify() 和 _configure_codex_csv_batch() 程序化写入
# ~/.codex/config.toml，不会直接读取此文件。
#
# 角色调度规则见 G9/G10。

# ─── Features ───

# enable_fanout — 启用 CSV 批处理编排（spawn_agents_on_csv）
# multi_agent（子代理）已 Stable 默认开启，无需显式配置
[features]
enable_fanout = true

# ─── Hooks ───

# notify — 代理轮次完成时触发
# 格式: notify = ["命令路径"]（数组格式）
# JSON payload 包含: type, thread-id, turn-id, cwd, client (v0.107+)
notify = ["helloagents --check-update --silent"]

# tui.notifications — 事件类型过滤（可选）
# 格式: 布尔或事件类型数组
# tui.notifications = ["agent-turn-complete", "approval-requested"]

# ─── 多代理配置（需 /experimental 或 /agent 开启）───

# 兼容边界: 命名 Codex agent 调用应使用 spawn_agent(agent_type="...", prompt="...")。
# prompt 需自包含目标、上下文和交付要求；默认不要组合 agent_type 与 fork_context=true。
# fork_context 是调用期参数，不是 TOML 角色配置项，避免首次不兼容 spawn 失败后再重试。

# 全局代理限制
# agents.max_threads = 16        # 最大并发子代理线程数（spawn_agent ≤6，CSV ≤64）
# agents.max_depth = 1           # 嵌套深度（默认 1，仅一层）

# 角色定义示例（按需取消注释并修改）
#
# 模型默认策略（重要）: 子代理默认继承主代理模型，无需为每个角色单独设 model。
# 不设 model = 继承顶层（主代理）model。
# 只有当某角色确实需要降级（如 explorer/monitor 用轻量模型省成本）时，才在对应
# [agents.xxx] 节显式设 model。下面注释掉的 model 行仅为"如需降级时"的参考，非默认建议。
#
# [agents.explorer]
# description = "Codebase exploration and dependency analysis"
# # model = "<轻量模型名>"          # 可选: explorer 可降级；不写则继承主代理
# # model_reasoning_effort = "medium"
# nickname_candidates = ["Scout", "Pathfinder", "Tracker"]

# [agents.worker]
# description = "Code implementation and modification"
# # 默认继承主代理模型；实现类任务通常需要主力模型能力，不建议降级
# nickname_candidates = ["Builder", "Forge", "Smith"]

# [agents.reviewer]
# description = "Code review and quality inspection"
# config_file = "agents/helloagents-readonly-reviewer.toml"
# # 默认继承主代理模型；config_file 只设 sandbox_mode，不含 model，保持继承
# nickname_candidates = ["Inspector", "Sentinel", "Auditor"]

# [agents.writer]
# description = "Standalone document generation"
# # 默认继承主代理模型
# nickname_candidates = ["Scribe", "Quill", "Chronicler"]

# [agents.brainstormer]
# description = "Proposal brainstorming specialist for multi-proposal comparison"
# # 默认继承主代理模型
